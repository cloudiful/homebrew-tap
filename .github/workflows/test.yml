name: Test tap

on:
  push:
    branches: [main]
  pull_request:

jobs:
  brew:
    strategy:
      matrix:
        os: [macos-14, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main
      - name: Tap this repository
        run: brew tap cloudiful/tap "$GITHUB_WORKSPACE"
      - name: Audit
        run: brew audit --strict cloudiful/tap/phasegent
      - name: Install and test
        run: |
          brew install --build-from-source cloudiful/tap/phasegent
          brew test cloudiful/tap/phasegent
          brew livecheck cloudiful/tap/phasegent || true
